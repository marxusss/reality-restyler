name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check release version
        shell: pwsh
        run: |
          $tagVersion = $env:GITHUB_REF_NAME -replace '^v', ''
          $appVersion = (Get-Content version.txt -Raw).Trim()
          if ($tagVersion -ne $appVersion) { throw "Tag $tagVersion does not match version.txt $appVersion." }
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build installer
        shell: pwsh
        run: .\installer\build-installer.ps1
      - name: Publish release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $tagObject = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object | select(.type == "tag") | .sha'
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($tagObject)) { throw 'Use an annotated release tag.' }
          $notes = gh api "repos/$env:GITHUB_REPOSITORY/git/tags/$tagObject" --jq '.message'
          if ($LASTEXITCODE -ne 0) { throw 'Could not read release notes from the tag.' }
          if ([string]::IsNullOrWhiteSpace($notes)) { throw 'Include release notes in the tag.' }
          $notes | gh release create $tag .\RealityRestylingSetup.exe .\RealityRestylingSetup.exe.sha256 .\RealityRestylingSource.zip --verify-tag --title $tag --notes-file -
