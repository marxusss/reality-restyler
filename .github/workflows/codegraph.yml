name: Interactive codebase graph

on:
  push:
    branches: [docs/interactive-codebase-graph]
  pull_request:
    paths:
      - scripts/build_codegraph.py
      - scripts/codegraph_template.html
      - .github/workflows/codegraph.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  code-atlas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Get graph generator
        uses: actions/checkout@v4
      - name: Get latest main source
        uses: actions/checkout@v4
        with:
          ref: main
          path: source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install syntax parsers
        run: python -m pip install tree-sitter-language-pack==1.25.0
      - name: Generate complete offline HTML and machine-readable JSON
        run: python scripts/build_codegraph.py --root source --out dist/reality-restyler-codegraph.html
      - name: Upload graph
        uses: actions/upload-artifact@v4
        with:
          name: reality-restyler-codegraph
          path: |
            dist/reality-restyler-codegraph.html
            dist/reality-restyler-codegraph.json
          if-no-files-found: error
          retention-days: 30
