name: Interactive codebase graph

on:
  push:
    branches: [docs/interactive-codebase-graph]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  code-atlas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Get graph generator
        uses: actions/checkout@v4
      - name: Get latest main source
        uses: actions/checkout@v4
        with:
          ref: main
          path: source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install syntax parsers
        run: python -m pip install tree-sitter-language-pack==1.25.0
      - name: Generate complete offline HTML and machine-readable JSON
        run: python scripts/build_codegraph.py --root source --out dist/reality-restyler-codegraph.html
      - name: Publish generated HTML to documentation branch
        shell: bash
        run: |
          mkdir -p docs
          cp dist/reality-restyler-codegraph.html docs/reality-restyler-codegraph.html
          cp dist/reality-restyler-codegraph.json docs/reality-restyler-codegraph.json
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add docs/reality-restyler-codegraph.html docs/reality-restyler-codegraph.json
          if git diff --cached --quiet; then
            echo "Graph is already current"
            exit 0
          fi
          git commit -m "Generate offline code atlas for current main"
          git push origin HEAD:docs/interactive-codebase-graph
