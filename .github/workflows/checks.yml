name: Targeted checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only test dependencies
        run: |
          python -m pip install --upgrade pip
          grep -E '^(aiohttp|aiortc|av|cryptography|Pillow|qrcode|numpy)==' requirements.txt > /tmp/test-requirements.txt
          python -m pip install -r /tmp/test-requirements.txt
      - name: Compile Python and run targeted tests
        run: |
          python -m compileall -q app.py runtime.py runtime_settings.py sessions.py local_frames.py webrtc_track.py launcher.py launcher_ipc.py log_retention.py model_setup.py tests
          python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser syntax and transport tests
        run: |
          for file in web/*.js; do node --experimental-default-type=module --check "$file"; done
          node --experimental-default-type=module --test tests/test_transport.mjs

  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Filter '*.ps1' | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw "$($_.Name): $($errors -join '; ')" }
          }
      - name: Compile Windows installer
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (-not (Test-Path $compiler)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup install failed' }
          }
          & $compiler /Qp installer/RealityRestyling.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
