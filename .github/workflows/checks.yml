name: Targeted checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only test dependencies
        run: |
          python -m pip install --upgrade pip
          grep -E '^(aiohttp|aiortc|av|cryptography|Pillow|qrcode|numpy)==' requirements.txt > /tmp/test-requirements.txt
          python -m pip install -r /tmp/test-requirements.txt
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.14.1+cpu'
      - name: Compile Python and run targeted tests
        run: |
          python -m compileall -q -x '/(\.git|\.venv|dist)/' .
          timeout --signal=INT --kill-after=5s 60s python -u -m unittest discover -s tests -t . -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser syntax and transport tests
        run: |
          for file in src/web/*.js; do node --check "$file"; done
          node --test tests/*.mjs

  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Filter '*.ps1' | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw "$($_.Name): $($errors -join '; ')" }
          }
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Compile Windows installer
        shell: pwsh
        run: .\installer\build-installer.ps1
