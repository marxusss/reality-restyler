<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#050505">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Reality Restyle">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <title>Reality Restyle</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <main id="app">
      <video id="output" autoplay playsinline muted></video>
      <canvas id="localOutput" hidden></canvas>
      <div id="shade"></div>
      <div id="startup" class="startup glass" role="status" aria-live="polite" hidden>
        <span id="startupLabel"></span>
        <progress id="startupProgress" max="8" value="0" aria-label="Startup stages completed"></progress>
        <button id="cancelStartupButton" class="toggle-button" type="button" hidden>Cancel</button>
      </div>
      <button id="flashButton" class="icon-button glass flash-button" type="button" aria-label="Flash" aria-pressed="false" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M13.3 2.5 5.8 13h5l-.5 8.5 7.9-11.1h-5.1l.2-7.9Z"/>
        </svg>
      </button>
      <div class="camera-controls">
        <div id="lensBar" class="lens-bar glass" role="group" aria-label="Camera lenses" hidden></div>
        <div id="captureFileActions" class="capture-file-actions glass" hidden>
          <button id="saveCaptureButton" class="toggle-button" type="button">Save</button>
          <button id="discardCaptureButton" class="icon-button small" type="button" aria-label="Discard capture">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m6 6 12 12M18 6 6 18"/>
            </svg>
          </button>
        </div>
        <div id="cameraActions" class="actions glass">
          <button id="settingsButton" class="icon-button" type="button" aria-label="Settings" aria-controls="settingsPanel" aria-expanded="false">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.63-.07-.94l2.03-1.58c.18-.14.23-.39.12-.6l-1.92-3.32c-.11-.2-.35-.27-.56-.2l-2.39.96c-.5-.38-1.04-.7-1.63-.94l-.36-2.54c-.03-.22-.21-.38-.44-.38h-3.8c-.22 0-.41.16-.44.38l-.36 2.54c-.59.24-1.13.56-1.63.94l-2.39-.96c-.21-.08-.45 0-.56.2L2.88 8.88c-.11.2-.06.46.12.6l2.03 1.58c-.05.31-.07.63-.07.94s.02.63.07.94l-2.03 1.58c-.18.14-.23.39-.12.6l1.92 3.32c.11.2.35.27.56.2l2.39-.96c.5.38 1.04.7 1.63.94l.36 2.54c.03.22.21.38.44.38h3.8c.22 0 .41-.16.44-.38l.36-2.54c.59-.24 1.13-.56 1.63-.94l2.39.96c.21.08.45 0 .56-.2l1.92-3.32c.11-.2.06-.46-.12-.6l-2.02-1.58zM12 15.5c-1.93 0-3.5-1.57-3.5-3.5s1.57-3.5 3.5-3.5 3.5 1.57 3.5 3.5-1.57 3.5-3.5 3.5z"/>
            </svg>
          </button>
          <button id="startButton" class="icon-button" type="button" aria-label="Start" title="Start">
            <svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8 5v14l11-7z"/>
            </svg>
            <svg class="pause-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M9 5v14m6-14v14"/>
            </svg>
          </button>
          <div class="capture-controls">
            <div class="mode-strip">
              <button id="captureModeButton" class="capture-mode" type="button" aria-label="Switch to photo">Video</button>
              <button id="captureOtherModeButton" class="capture-mode-other" type="button" aria-label="Switch to photo">Photo</button>
            </div>
            <button id="shutterButton" class="shutter-button" type="button" aria-label="Record video" disabled></button>
          </div>
          <button id="quickStylesButton" class="icon-button" type="button" aria-label="Styles" aria-haspopup="dialog" aria-expanded="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 0 0 0 18h1.7a3 3 0 0 0 2.2-5.1 1.7 1.7 0 0 1 1.2-2.9H19a3 3 0 0 0 3-3A9 9 0 0 0 12 3Z"/><circle cx="7.5" cy="10" r=".9"/><circle cx="10.5" cy="6.7" r=".9"/><circle cx="15.4" cy="7.5" r=".9"/><circle cx="7.2" cy="15" r=".9"/></svg>
          </button>
        </div>
      </div>
      <section id="settingsPanel" class="settings-panel glass" aria-label="Settings" hidden>
        <div class="prompt-line">
          <textarea id="promptInput" rows="1" maxlength="2000" spellcheck="false" enterkeyhint="done" aria-label="Prompt" placeholder="Describe a look…"></textarea>
          <button id="stylesButton" class="toggle-button" type="button" aria-haspopup="dialog" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 0 0 0 18h1.7a3 3 0 0 0 2.2-5.1 1.7 1.7 0 0 1 1.2-2.9H19a3 3 0 0 0 3-3A9 9 0 0 0 12 3Z"/><circle cx="7.5" cy="10" r=".9"/><circle cx="10.5" cy="6.7" r=".9"/><circle cx="15.4" cy="7.5" r=".9"/><circle cx="7.2" cy="15" r=".9"/></svg><span>Styles</span></button>
          <button id="doneSettingsButton" class="toggle-button settings-done" type="button" aria-label="Apply settings and close">Done</button>
        </div>
        <div class="setting-row">
          <label class="field steps-field">
            <span>Steps</span>
            <div class="range-wrap">
              <input id="stepsInput" type="range" min="1" max="4" value="4">
              <output id="stepsValue">4</output>
            </div>
          </label>
          <div class="resolution-field" role="group" aria-label="Resolution">
            <button id="decreaseResolution" type="button" aria-label="Decrease resolution" disabled>−</button>
            <output id="resolutionValue" aria-label="Current resolution">512</output>
            <button id="increaseResolution" type="button" aria-label="Increase resolution">+</button>
          </div>
          <button id="upscaleButton" class="toggle-button" type="button" aria-pressed="true">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 15v5h5M20 9V4h-5"/>
              <path d="m4 20 7-7m2-2 7-7"/>
            </svg>
            <span>Upscale</span>
          </button>
        </div>
        <div class="setting-footer" aria-label="Diagnostics and model">
          <div id="latency" class="latency" title="Model inference, measured round trip, and AI frames per second">Model&nbsp;—&nbsp;ms · RTT&nbsp;—&nbsp;ms · —&nbsp;AI&nbsp;FPS</div>
          <button id="quitModelButton" class="toggle-button" type="button">Load model</button>
        </div>
      </section>
      <dialog id="stylesDialog" class="style-dialog glass" aria-label="Styles">
        <div class="style-search-row">
          <label class="style-search">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6"/><path d="m15 15 5 5"/></svg>
            <input id="styleSearch" type="search" placeholder="Search styles" aria-label="Search styles" aria-controls="styleList" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
          </label>
          <button id="closeStylesButton" class="icon-button small" type="button" aria-label="Close styles" autofocus>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m6 6 12 12M18 6 6 18"/>
            </svg>
          </button>
        </div>
        <div id="styleList" class="style-list" role="region" aria-label="Style library" tabindex="0">
          <section id="customStyleSection" class="style-group" data-group="Custom Styles" aria-labelledby="customStylesTitle" hidden>
            <h3><button class="style-group-header" type="button" aria-expanded="true" aria-controls="customStyles"><span id="customStylesTitle">Custom Styles</span><span class="style-group-count"></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg></button></h3>
            <div id="customStyles" class="style-grid"></div>
          </section>
          <p id="styleStorageError" class="style-error" role="alert" hidden></p>
          <div id="presetStyles" class="style-groups"></div>
          <p id="styleSearchEmpty" class="style-empty" role="status" hidden>No styles match</p>
          <p id="catalogError" class="style-error" role="alert" hidden></p>
        </div>
        <p id="styleCombineError" class="style-error" role="alert" hidden></p>
        <div class="style-toolbar style-toolbar-bottom">
          <button id="combineStylesButton" class="toggle-button" type="button" aria-pressed="false">Combine Styles</button>
          <button id="addStyleButton" class="toggle-button" type="button">+<span>Add Style</span></button>
          <button id="useStylesButton" class="toggle-button style-save" type="button" hidden>Use</button>
        </div>
      </dialog>
      <dialog id="styleEditor" class="style-dialog style-editor glass" aria-labelledby="styleEditorTitle">
        <form id="styleForm">
          <div class="panel-top">
            <h2 id="styleEditorTitle">Add Style</h2>
            <div class="style-actions">
              <button class="toggle-button keyboard-done" type="button" aria-label="Dismiss keyboard">Done</button>
              <button id="closeStyleEditorButton" class="icon-button small" type="button" aria-label="Close style editor">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="m6 6 12 12M18 6 6 18"/>
                </svg>
              </button>
            </div>
          </div>
          <div class="style-editor-fields">
            <label class="field">
              <span>Name</span>
              <input id="styleName" type="text" maxlength="60" required autofocus>
            </label>
            <label class="field">
              <span>Prompt</span>
              <textarea id="stylePrompt" rows="4" maxlength="2000" spellcheck="false" required></textarea>
            </label>
            <img id="styleCapturePreview" width="320" height="200" alt="Captured style" hidden>
            <p id="styleEditorError" class="style-error" role="alert" hidden></p>
          </div>
          <div class="style-toolbar style-toolbar-bottom">
            <div class="style-editor-actions">
              <button id="captureStyleButton" class="toggle-button" type="button">Capture style</button>
              <button id="deleteStyleButton" class="toggle-button style-delete" type="button" hidden>Delete</button>
            </div>
            <button class="toggle-button style-save" type="submit">Save</button>
          </div>
        </form>
      </dialog>
      <div id="error" class="error glass" role="alert" hidden></div>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
