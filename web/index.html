<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>Reality Restyle</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main id="app">
<video id="output" autoplay playsinline muted></video>
<canvas id="localOutput" hidden></canvas>
<div id="shade"></div>
<header class="topbar">
<div id="latency" class="latency" hidden></div>
</header>
<div id="startup" class="startup" role="status" aria-live="polite" hidden>
<span id="startupLabel"></span>
<div id="startupProgress" class="startup-track" role="progressbar" aria-label="Startup progress" aria-valuemin="0" aria-valuemax="100"><span id="startupFill" class="startup-fill"></span></div>
</div>
<div class="actions">
<button id="flashButton" class="icon-button" type="button" aria-label="Flash" aria-pressed="false" hidden>
<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.3 2.5 5.8 13h5l-.5 8.5 7.9-11.1h-5.1l.2-7.9Z"/></svg>
</button>
<button id="startButton" class="start-button" type="button">Start</button>
<button id="settingsButton" class="icon-button" type="button" aria-label="Settings" aria-expanded="false">
<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.63-.07-.94l2.03-1.58c.18-.14.23-.39.12-.6l-1.92-3.32c-.11-.2-.35-.27-.56-.2l-2.39.96c-.5-.38-1.04-.7-1.63-.94l-.36-2.54c-.03-.22-.21-.38-.44-.38h-3.8c-.22 0-.41.16-.44.38l-.36 2.54c-.59.24-1.13.56-1.63.94l-2.39-.96c-.21-.08-.45 0-.56.2L2.88 8.88c-.11.2-.06.46.12.6l2.03 1.58c-.05.31-.07.63-.07.94s.02.63.07.94l-2.03 1.58c-.18.14-.23.39-.12.6l1.92 3.32c.11.2.35.27.56.2l2.39-.96c.5.38 1.04.7 1.63.94l.36 2.54c.03.22.21.38.44.38h3.8c.22 0 .41-.16.44-.38l.36-2.54c.59-.24 1.13-.56 1.63-.94l2.39.96c.21.08.45 0 .56-.2l1.92-3.32c.11-.2.06-.46-.12-.6l-2.02-1.58zM12 15.5c-1.93 0-3.5-1.57-3.5-3.5s1.57-3.5 3.5-3.5 3.5 1.57 3.5 3.5-1.57 3.5-3.5 3.5z"/></svg>
</button>
<button id="mirrorButton" class="icon-button" type="button" aria-label="Mirror" aria-pressed="false">
<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18"/><path d="m8 7-4 5 4 5M16 7l4 5-4 5"/></svg>
</button>
</div>
<section id="settingsPanel" class="settings-panel" aria-label="Settings" hidden>
<div class="panel-top">
<span>Settings</span>
<button id="closeSettingsButton" class="icon-button small" type="button" aria-label="Close settings">
<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
</button>
</div>
<label class="field prompt-field"><span>Prompt</span><textarea id="promptInput" rows="3" maxlength="2000" spellcheck="false"></textarea></label>
<div class="setting-row">
<label class="field"><span>Steps</span><div class="range-wrap"><input id="stepsInput" type="range" min="1" max="12" value="4"><output id="stepsValue">4</output></div></label>
<label class="field"><span>Resolution</span><select id="resolutionInput"><option value="512">512</option><option value="640">640</option><option value="768">768</option><option value="896">896</option><option value="1024" selected>1024</option></select></label>
</div>
<div class="setting-row">
<label class="field"><span>Seed</span><div class="seed-wrap"><input id="seedInput" type="number" min="0" max="2147483647" value="0" inputmode="numeric"><button id="randomSeedButton" class="icon-button small" type="button" aria-label="Random seed"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M5.6 9A7 7 0 0 1 18 6.5L20 12M4 12l2 5.5A7 7 0 0 0 18.4 15"/></svg></button></div></label>
<label class="field"><span>Camera</span><select id="cameraInput"></select></label>
</div>
<div class="setting-footer">
<button id="upscaleButton" class="toggle-button" type="button" aria-pressed="true">
<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 15v5h5M20 9V4h-5"/><path d="m4 20 7-7m2-2 7-7"/></svg><span>Upscale</span>
</button>
<div class="setting-actions">
<button id="setSettingsButton" class="toggle-button" type="button">Set</button>
<button id="stopModelButton" class="toggle-button" type="button">Stop</button>
</div>
</div>
</section>
<div id="error" class="error" role="alert" hidden></div>
</main>
<script src="/app.js" defer></script>
</body>
</html>
