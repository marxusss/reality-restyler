<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>Reality Restyle</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main id="app">
<video id="output" autoplay playsinline muted></video>
<canvas id="localOutput" hidden></canvas>
<div id="shade"></div>
<header class="topbar">
<div id="latency" class="latency" hidden></div>
</header>
<div id="startup" class="startup" role="status" aria-live="polite" hidden>
<span id="startupLabel"></span>
<progress id="startupProgress" max="8" value="0" aria-label="Startup stages completed"></progress>
</div>
<div class="camera-controls">
<div id="lensBar" class="lens-bar" role="group" aria-label="Camera lenses" hidden></div>
<div id="captureFileActions" class="capture-file-actions" hidden>
<button id="saveCaptureButton" class="toggle-button" type="button">Save</button>
<button id="discardCaptureButton" class="icon-button small" type="button" aria-label="Discard capture"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
</div>
<div class="actions">
<button id="flashButton" class="icon-button" type="button" aria-label="Flash" aria-pressed="false" hidden>
<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.3 2.5 5.8 13h5l-.5 8.5 7.9-11.1h-5.1l.2-7.9Z"/></svg>
</button>
<button id="startButton" class="icon-button" type="button" aria-label="Start" title="Start">
<svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
<svg class="pause-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5v14m6-14v14"/></svg>
</button>
<div class="capture-controls">
<button id="captureModeButton" class="capture-mode" type="button" aria-label="Switch to video">Photo</button>
<button id="shutterButton" class="shutter-button" type="button" aria-label="Take photo" disabled></button>
</div>
<button id="settingsButton" class="icon-button" type="button" aria-label="Settings" aria-controls="settingsPanel" aria-expanded="false">
<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.63-.07-.94l2.03-1.58c.18-.14.23-.39.12-.6l-1.92-3.32c-.11-.2-.35-.27-.56-.2l-2.39.96c-.5-.38-1.04-.7-1.63-.94l-.36-2.54c-.03-.22-.21-.38-.44-.38h-3.8c-.22 0-.41.16-.44.38l-.36 2.54c-.59.24-1.13.56-1.63.94l-2.39-.96c-.21-.08-.45 0-.56.2L2.88 8.88c-.11.2-.06.46.12.6l2.03 1.58c-.05.31-.07.63-.07.94s.02.63.07.94l-2.03 1.58c-.18.14-.23.39-.12.6l1.92 3.32c.11.2.35.27.56.2l2.39-.96c.5.38 1.04.7 1.63.94l.36 2.54c.03.22.21.38.44.38h3.8c.22 0 .41-.16.44-.38l.36-2.54c.59-.24 1.13-.56 1.63-.94l2.39.96c.21.08.45 0 .56-.2l1.92-3.32c.11-.2.06-.46-.12-.6l-2.02-1.58zM12 15.5c-1.93 0-3.5-1.57-3.5-3.5s1.57-3.5 3.5-3.5 3.5 1.57 3.5 3.5-1.57 3.5-3.5 3.5z"/></svg>
</button>
<button id="mirrorButton" class="icon-button" type="button" aria-label="Mirror" aria-pressed="false">
<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18"/><path d="m8 7-4 5 4 5M16 7l4 5-4 5"/></svg>
</button>
</div>
</div>
<section id="settingsPanel" class="settings-panel" aria-label="Settings" hidden>
<div class="field prompt-field">
<div class="prompt-heading"><label for="promptInput">Prompt</label><div class="style-actions"><button id="stylesButton" class="toggle-button" type="button" aria-haspopup="dialog">Styles</button><button id="clearPromptButton" class="toggle-button" type="button">Clear prompt</button><button class="toggle-button keyboard-done" type="button" aria-label="Dismiss keyboard">Done</button></div></div>
<textarea id="promptInput" rows="3" maxlength="2000" spellcheck="false" enterkeyhint="done"></textarea>
</div>
<div class="setting-row">
<label class="field"><span>Steps</span><div class="range-wrap"><input id="stepsInput" type="range" min="1" max="4" value="4"><output id="stepsValue">4</output></div></label>
<label class="field"><span>Resolution</span><select id="resolutionInput"><option value="512" selected>512</option><option value="640">640</option><option value="768">768</option><option value="896">896</option><option value="1024">1024</option></select></label>
</div>
<div class="setting-footer">
<button id="upscaleButton" class="toggle-button" type="button" aria-pressed="true">
<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 15v5h5M20 9V4h-5"/><path d="m4 20 7-7m2-2 7-7"/></svg><span>Upscale</span>
</button>
<a class="toggle-button feedback-link" href="https://github.com/marxusss/reality-restyler/issues/new" target="_blank" rel="noopener noreferrer">Feedback</a>
<button id="quitModelButton" class="toggle-button" type="button">Unload model</button>
</div>
</section>
<dialog id="stylesDialog" class="style-dialog" aria-labelledby="stylesTitle">
<div class="panel-top">
<h2 id="stylesTitle">Styles</h2>
<button id="closeStylesButton" class="icon-button small" type="button" aria-label="Close styles"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
</div>
<div id="styleList" class="style-list">
<section id="customStyleSection" aria-labelledby="customStylesTitle" hidden>
<h3 id="customStylesTitle">Custom styles</h3>
<div id="customStyles" class="style-grid"></div>
</section>
<p id="styleStorageError" class="style-error" role="alert" hidden></p>
<div id="presetStyles" class="style-grid"></div>
<p id="catalogError" class="style-error" role="alert" hidden></p>
</div>
<p id="styleCombineError" class="style-error" role="alert" hidden></p>
<div class="style-toolbar style-toolbar-bottom"><button id="combineStylesButton" class="toggle-button" type="button" aria-pressed="false">Combine styles</button><button id="addStyleButton" class="toggle-button" type="button">+ Add style</button><button id="useStylesButton" class="toggle-button style-save" type="button" hidden>Use</button></div>
</dialog>
<dialog id="styleEditor" class="style-dialog style-editor" aria-labelledby="styleEditorTitle">
<form id="styleForm">
<div class="panel-top">
<h2 id="styleEditorTitle">Add style</h2>
<div class="style-actions">
<button class="toggle-button keyboard-done" type="button" aria-label="Dismiss keyboard">Done</button>
<button id="closeStyleEditorButton" class="icon-button small" type="button" aria-label="Close style editor"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
</div>
</div>
<label class="field"><span>Name</span><input id="styleName" type="text" maxlength="60" required autofocus></label>
<label class="field"><span>Prompt</span><textarea id="stylePrompt" rows="4" maxlength="2000" spellcheck="false" required></textarea></label>
<img id="styleCapturePreview" width="320" height="200" alt="Captured style" hidden>
<p id="styleEditorError" class="style-error" role="alert" hidden></p>
<div class="style-toolbar style-toolbar-bottom">
<button id="captureStyleButton" class="toggle-button" type="button">Capture style</button>
<button class="toggle-button style-save" type="submit">Save</button>
</div>
</form>
</dialog>
<div id="error" class="error" role="alert" hidden></div>
</main>
<script type="module" src="/app.js"></script>
</body>
</html>
